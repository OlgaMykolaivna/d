<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер «Дино-абетка»</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Nunito', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 35px;
            padding: 30px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 8px rgba(255, 255, 255, 0.4);
            text-align: center;
            position: relative;
        }

        h1 {
            color: #2e7d32;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #c8e6c9;
        }

        .instruction {
            color: #558b2f;
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        /* Сітка карток-кнопок з дино-літерами */
        .letters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 550px) {
            .letters-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .letter-btn {
            background: #ff7043;
            border: none;
            border-radius: 20px;
            padding: 18px 10px;
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: 900;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #d84315;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .letter-btn span.big-letter {
            font-size: 2rem;
            background: rgba(0,0,0,0.15);
            padding: 2px 14px;
            border-radius: 12px;
        }

        .letter-btn:nth-child(1) { background: #e65100; box-shadow: 0 6px 0 #bf360c; }
        .letter-btn:nth-child(2) { background: #0288d1; box-shadow: 0 6px 0 #01579b; }
        .letter-btn:nth-child(3) { background: #7cb342; box-shadow: 0 6px 0 #558b2f; }
        .letter-btn:nth-child(4) { background: #8e24aa; box-shadow: 0 6px 0 #6a1b9a; }
        .letter-btn:nth-child(5) { background: #fbc02d; color: #333; box-shadow: 0 6px 0 #f57f17; }
        .letter-btn:nth-child(6) { background: #e53935; box-shadow: 0 6px 0 #b71c1c; }

        .letter-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
        }

        .letter-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* Велика картка перегляду */
        .card-modal {
            background: #f1f8e9;
            border: 4px dashed #7cb342;
            border-radius: 25px;
            padding: 25px;
            margin-top: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-emoji {
            font-size: 5.5rem;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .card-poem {
            font-size: 1.15rem;
            font-weight: 800;
            color: #33691e;
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 15px;
            line-height: 1.4;
            width: 100%;
            border: 2px solid #dcedc8;
        }

        .speak-btn {
            background: #43a047;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e7d32;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speak-btn:hover {
            background: #388e3c;
            transform: translateY(-2px);
        }

        .speak-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🦖 Дино-абетка</h1>
        <p class="instruction" id="instructionText">Обери динозаврика, щоб познайомитися з ним!</p>

        <!-- Кнопки-картки динозаврів -->
        <div class="letters-grid" id="lettersGrid">
            <button class="letter-btn" onclick="openCard('Т')">
                <span class="big-letter">Т</span> Ті-Рекс
            </button>
            <button class="letter-btn" onclick="openCard('П')">
                <span class="big-letter">П</span> Птеродактиль
            </button>
            <button class="letter-btn" onclick="openCard('Б')">
                <span class="big-letter">Б</span> Брахіозавр
            </button>
            <button class="letter-btn" onclick="openCard('Тр')">
                <span class="big-letter">Тр</span> Трицератопс
            </button>
            <button class="letter-btn" onclick="openCard('С')">
                <span class="big-letter">С</span> Стегозавр
            </button>
            <button class="letter-btn" onclick="openCard('В')">
                <span class="big-letter">В</span> Велоцираптор
            </button>
        </div>

        <!-- Велика картка для обраного динозавра -->
        <div class="card-modal" id="cardModal">
            <div class="card-emoji" id="cardEmoji">🦖</div>
            <div class="card-title" id="cardTitle">Т — Ті-Рекс</div>
            <div class="card-poem" id="cardPoem">Грозний і могутній Ті-Рекс шагає,<ур>У джунглях кращого героя немає!</div>
            <button class="speak-btn" onclick="speakCurrentDinosaurs()">
                🔊 Послухати звук
            </button>
        </div>
    </div>

    <script>
        // База даних для динозаврів
        const dinoData = {
            'Т': {
                emoji: '🦖',
                title: 'Т — Ті-Рекс',
                poem: 'Грозний і могутній Ті-Рекс крокує,<br>У джунглях кращого героя немає!',
                speechText: 'Ті-Рекс. Літера Т. Грозний і могутній Ті-Рекс крокує, у джунглях кращого героя немає!'
            },
            'П': {
                emoji: '🦅',
                title: 'П — Птеродактиль',
                poem: 'Птеродактиль в небі крилами махає,<br>Хмаринки високі весело вітає!',
                speechText: 'Птеродактиль. Літера П. Птеродактиль в небі крилами махає, хмаринки високі весело вітає!'
            },
            'Б': {
                emoji: '🦕',
                title: 'Б — Брахіозавр',
                poem: 'Довгошиїй брахіозавр листочки дістає,<br>Найвищим деревам у лісі радість дає!',
                speechText: 'Брахіозавр. Літера Б. Довгошиїй брахіозавр листочки дістає, найвищим деревам у лісі радість дає!'
            },
            'Тр': {
                emoji: '🛡️',
                title: 'Тр — Трицератопс',
                poem: 'Три круті роги на міцнім чолі,<br>Найдобріший велетень на цій Землі!',
                speechText: 'Трицератопс. Літери Тр. Три круті роги на міцнім чолі, найдобріший велетень на цій Землі!'
            },
            'С': {
                emoji: '🌿',
                title: 'С — Стегозавр',
                poem: 'На спині у стегозавра пластини яскраві,<br>Він гуляє вранці у зеленій траві!',
                speechText: 'Стегозавр. Літера С. На спині у стегозавра пластини яскраві, він гуляє вранці у зеленій траві!'
            },
            'В': {
                emoji: '⚡',
                title: 'В — Велоцираптор',
                poem: 'Швидкий велоцираптор біжить уперед,<br>Для нього у світі немає перешкод і бід!',
                speechText: 'Велоцираптор. Літера В. Швидкий велоцираптор біжить уперед, для нього у світі немає перешкод і бід!'
            }
        };

        let currentKey = 'Т';

        function openCard(key) {
            currentKey = key;
            const data = dinoData[key];
            
            document.getElementById('cardEmoji').textContent = data.emoji;
            document.getElementById('cardTitle').textContent = data.title;
            document.getElementById('cardPoem').innerHTML = data.poem;

            const modal = document.getElementById('cardModal');
            modal.style.display = 'flex';

            // Автоматичне озвучування при кліку
            speakCurrentDinosaurs();
        }

        // Функція озвучування за допомогою Web Speech API
        function speakCurrentDinosaurs() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Зупинити попереднє відтворення
                const data = dinoData[currentKey];
                const utterance = new SpeechSynthesisUtterance(data.speechText);
                utterance.lang = 'uk-UA';
                utterance.rate = 0.9; // Трохи повільніше для дітей
                window.speechSynthesis.speak(utterance);
            } else {
                alert('На жаль, ваш браузер не підтримує синтез мовлення.');
            }
        }
    </script>
</body>
</html>
